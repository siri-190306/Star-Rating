<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rating Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="rating-card">
        <div class="emoji">💖</div>
        <h1>Rate Your Experience</h1>
        <p class="subtitle">Your feedback means a lot to us!</p>
        <div class="stars" id="stars">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
        <p id="rating-text">Choose your rating ⭐</p>
        <button id="reset-btn">Reset Rating ↻</button>
        <p class="footer">Made with ❤️ for your feedback</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
